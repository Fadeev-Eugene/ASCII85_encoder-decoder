name: CI Pipeline

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install C++ and Python dependencies
      run: |
        sudo apt-get update
        # Базовые инструменты для C++ и Make
        sudo apt-get install -y build-essential make cmake
        # Зависимости для Google Test
        sudo apt-get install -y libgtest-dev
        # Python и тестовые зависимости
        sudo apt-get install -y python3 python3-pip
        # Сборка Google Test
        cd /usr/src/gtest
        sudo cmake CMakeLists.txt
        sudo make
        sudo cp *.a /usr/lib
        # Установка Python-зависимостей (если нужны)
        python3 -m pip install pytest

    - name: Build project
      run: make

    - name: Run C++ tests
      run: make test

    - name: Run Python tests
      run: python3 tests.py
